<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Truy Tìm Gián Điệp - Undercover</title>

    <meta name="description" content="Trò chơi suy luận siêu vui dành cho hội bạn. Tìm ra kẻ ngoại đạo đang lẩn trốn qua những từ khóa bí ẩn. Ai mới là Gián điệp?">
    <meta name="theme-color" content="#1e272e">
    
    <!-- Favicon (Icon trên tab trình duyệt) -->
    <link rel="icon" type="image/png" href="https://i1.sndcdn.com/avatars-000525105435-9vvk6e-t500x500.jpg">
    <!-- Open Graph (Hiển thị xem trước trên Facebook, Zalo...) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Gián Điệp (Undercover) - Kẻ Ngoại Đạo">
    <meta property="og:description" content="Đấu trí bằng ngôn từ, tìm ra kẻ lạc loài đang giả vờ hiểu biết. Chơi ngay cùng hội bạn!">
    <meta property="og:image" content="https://nguyenthehung173205.github.io/gian_diep/gian_diep.png">
    <meta property="og:url" content="https://nguyenthehung173205.github.io/gian_diep/">
    
    <!-- Hiển thị xem trước trên Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Gián Điệp (Undercover) - Kẻ Ngoại Đạo">
    <meta name="twitter:description" content="Đấu trí bằng ngôn từ, tìm ra kẻ lạc loài đang giả vờ hiểu biết.">
    <meta name="twitter:image" content="https://nguyenthehung173205.github.io/gian_diep/gian_diep.png">
    
    <link rel="stylesheet" href="styles.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom UI thay thế SweetAlert2 sẽ được chèn bằng CSS/JS -->

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>

    <div class="container">
        
        <!-- =======================
             SCREEN 1: LOBBY
        ======================== -->
        <div id="screen-lobby" class="screen active">
            <h1><i class="fa-solid fa-user-secret"></i> UNDERCOVER</h1>
            
            <div style="display: flex; gap: 10px;">
                <button id="btn-create-room" style="flex:1;">Tạo Phòng</button>
                <button id="btn-show-join" style="flex:1; background: var(--panel-bg); color: var(--accent);">Vào Phòng</button>
            </div>

            <div id="join-form" style="display: none; flex-direction: column; gap: 10px; margin-top: 20px;">
                <input type="number" id="input-room-code" placeholder="Nhập mã phòng (4 số)">
                <input type="text" id="input-player-name" placeholder="Tên của bạn">
                <button id="btn-join-room">Vào Chơi</button>
            </div>
        </div>

        <!-- =======================
             SCREEN 2: WAITING ROOM
        ======================== -->
        <div id="screen-waiting" class="screen">
            <h2>Phòng: <span id="display-room-code" style="color:white;">----</span></h2>
            
            <div id="gm-settings" style="display: none; flex-direction: column; gap: 10px;">
                <div class="settings-group">
                    <label>Gián Điệp (Spy):</label>
                    <input type="number" id="input-spies" value="1" min="1">
                </div>
                <div class="settings-group">
                    <label>Mũ Trắng (White Hat):</label>
                    <input type="number" id="input-whitehats" value="0" min="0">
                </div>
                <div class="settings-group" style="flex-direction: row; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px;">
                    <label style="margin: 0; font-size: 14px;">Bật lộ thân phận khi bị loại</label>
                    <label class="switch" style="position: relative; display: inline-block; width: 40px; height: 20px;">
                        <input type="checkbox" id="checkbox-reveal-waiting" class="toggle-switch-input" checked style="opacity: 0; width: 0; height: 0;">
                        <span class="slider"></span>
                    </label>
                </div>
                <button id="btn-start-game" style="margin-top: 10px;">Bắt Đầu Trò Chơi</button>
            </div>

            <h3 style="text-align: left; font-size: 14px; margin-top: 20px; color: #888;">DANH SÁCH NGƯỜI CHƠI (Tổng: <span id="waiting-count">0</span>)</h3>
            <div class="player-list" id="waiting-player-list">
                <!-- Chứa danh sách người chơi chờ -->
            </div>
            
            <button id="btn-leave-room-waiting" class="btn-danger" style="margin-top: 20px; width: 100%;">Thoát Phòng</button>
        </div>

        <!-- =======================
             SCREEN 3: PLAYING
        ======================== -->
        <div id="screen-playing" class="screen">
            
            <!-- THÔNG TIN PHÒNG VÀ NGƯỜI CHƠI -->
            <div id="playing-header" style="text-align: center; margin-bottom: 20px; font-family: 'Orbitron', sans-serif; font-size: 16px;">
                Phòng: <span id="display-playing-room-code" style="color: var(--accent);"></span> | 
                Tên: <span id="display-playing-name" style="color: var(--accent);"></span>
            </div>

            <!-- THẺ BÀI -->
            <div class="scene">
                <div class="card" id="keyword-card" style="user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;">
                    <div class="card__face card__face--front">
                        <i class="fa-solid fa-fingerprint"></i>
                        <p>CHẠM VÀ GIỮ ĐỂ XEM</p>
                    </div>
                    <div class="card__face card__face--back">
                        <h3 id="display-keyword">???</h3>
                        <p>Buông tay để úp bài lại</p>
                    </div>
                </div>
            </div>

            <!-- BẢNG ĐIỀU KHIỂN GM (Ẩn với người thường) -->
            <button id="btn-gm-menu" style="display: none; margin-top: 10px;"><i class="fa-solid fa-bars"></i> Menu Quản Phòng</button>
            
            <div id="gm-menu-content" class="gm-menu-container" style="display: none;">
                <div class="gm-controls">
                    <button id="btn-reset-room" class="btn-primary">Bắt đầu ván mới</button>
                    <button id="btn-cancel-room" class="btn-danger">Hủy Phòng</button>
                </div>
                <h3 style="margin-top: 20px; font-size: 14px; color:#888;">Quản lý người chơi</h3>
                <div class="player-list" id="playing-player-list">
                    <!-- Chứa danh sách người chơi để GM quản lý -->
                </div>
                <button id="btn-toggle-reveal-playing" style="width: 100%; margin-top: 15px; background: transparent; border: 2px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s;">
                    <i class="fa-solid fa-eye"></i> <span>Lộ diện: ĐANG BẬT</span>
                </button>
            </div>

            <button id="btn-leave-room-playing" class="btn-danger" style="margin-top: 20px; width: 100%;">Thoát Phòng</button>
        </div>

    </div>

    <!-- HỆ THỐNG THÔNG BÁO CUSTOM -->
    <div id="toast-container"></div>
    <div id="custom-modal-overlay" class="hidden">
        <div id="custom-modal">
            <div class="modal-header">
                <i id="modal-icon"></i>
                <h3 id="modal-title">Tiêu đề</h3>
            </div>
            <div class="modal-body" id="modal-body">Nội dung</div>
            <div class="modal-footer" id="modal-footer">
                <!-- Các nút bấm sẽ được sinh tự động -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
